name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Synchronize locked environment
        run: uv sync --frozen

      - name: Run feature-selection regression tests
        run: >-
          uv run pytest -q --tb=short -x
          tests/unit/test_feature_selection.py
          tests/unit/test_optuna_template_evolution.py

      - name: Run full test suite
        run: uv run pytest -q --tb=short -x

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run Pyright
        run: uv run pyright

      - name: Run end-to-end demo
        run: uv run automl demo --output-root runs/ci-demo
